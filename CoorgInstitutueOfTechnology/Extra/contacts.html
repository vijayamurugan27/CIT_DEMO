<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Premium Experience</title>
    <meta name="description" content="Get in touch with us.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient-1"></div>
    <div class="bg-gradient-2"></div>

    <nav class="glass-tabs">
        <a href="index.html" class="tab">Home</a>
        <a href="products.html" class="tab">Products</a>
        <a href="services.html" class="tab">Services</a>
        <a href="testimonials.html" class="tab">Testimonials</a>
        <a href="contacts.html" class="tab active">Contact</a>
    </nav>

    <div class="container">
        <div class="hero" style="padding: 40px 0;">
            <h1 class="fade-in">Let's Connect</h1>
            <p class="fade-in delay-1">Ready to elevate your business? Drop us a message.</p>
        </div>
        
        <div class="contact-form fade-in delay-2">
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you for reaching out!');">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" class="form-control" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
